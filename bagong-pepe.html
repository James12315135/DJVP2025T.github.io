<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Journals</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
    }

    h2 {
      text-align: center;
      margin-top: -10px;
      color: #666;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #007bff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .journal-entry {
      border-top: 1px solid #ccc;
      padding: 10px 0;
    }

    .journal-entry h3 {
      margin: 0;
    }

    .journal-entry p {
      margin: 5px 0 0;
      white-space: pre-wrap;
    }

    .journal-entry .date {
      font-size: 0.8em;
      color: gray;
    }

    .delete-btn {
      margin-top: 10px;
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://assets.onecompiler.app/43g9mh83g/43g9mdew3/DJVPLogo.png" alt="My Journal Logo" style="max-width: 150px; display: block; margin: 0 auto 10px;" />
    <h1>📔 Weekly Journals</h1>
    <h2>(DJVP)</h2> 

    <form id="journalForm">
      <input type="text" id="title" placeholder="Journal Title" required />
      <textarea id="content" placeholder="Write your thoughts..." required></textarea>
      <input type="date" id="entryDate" required />
      <button type="submit">Add Journal</button>
    </form>

    <div id="journalList"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("journalForm");
      const titleInput = document.getElementById("title");
      const contentInput = document.getElementById("content");
      const dateInput = document.getElementById("entryDate");
      const journalList = document.getElementById("journalList");

      function loadJournals() {
        const journals = JSON.parse(localStorage.getItem("journals")) || [];
        journalList.innerHTML = "";

        journals.forEach((entry, index) => {
          const div = document.createElement("div");
          div.className = "journal-entry";
          div.innerHTML = `
            <h3>${entry.title}</h3>
            <p class="date">${entry.date}</p>
            <p>${entry.content}</p>
            <button class="delete-btn" data-index="${index}">Delete</button>
          `;
          journalList.appendChild(div);
        });

        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const index = e.target.getAttribute("data-index");
            const confirmed = confirm("Are you sure you want to delete this journal entry?");
            if (confirmed) {
              const journals = JSON.parse(localStorage.getItem("journals")) || [];
              journals.splice(index, 1);
              localStorage.setItem("journals", JSON.stringify(journals));
              loadJournals();
            }
          });
        });
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const newEntry = {
          title: titleInput.value,
          content: contentInput.value,
          date: dateInput.value
        };

        const journals = JSON.parse(localStorage.getItem("journals")) || [];
        journals.push(newEntry);
        localStorage.setItem("journals", JSON.stringify(journals));

        titleInput.value = "";
        contentInput.value = "";
        dateInput.value = "";
        loadJournals();
      });

      loadJournals();
    });
  </script>
</body>
</html>
